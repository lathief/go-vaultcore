global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The api does not expose /metrics yet; the target stays "down" in
  # Prometheus until a metrics endpoint is added.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
